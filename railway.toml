[build]
builder = "DOCKERFILE"
# dockerfilePath se define por servicio via RAILWAY_DOCKERFILE_PATH:
#   layercut    → Dockerfile (raíz, default)
#   hyperframes → hyperframes-service/Dockerfile

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
